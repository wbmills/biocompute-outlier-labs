[project]
name = "neurohear"
version = "0.1.0"
description = "Adaptive neural I/O: encoding optimiser for biological neural cultures (hackathon prototype)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "starlette>=0.37", "uvicorn>=0.29"]

[project.optional-dependencies]
test = ["pytest>=8"]
cl = ["cl-sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
